name: Feed Keeper

# Daily, before the Find of the Day post: regenerate the Google
# Merchant Center feed from the catalog snapshot and ping IndexNow.
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-keeper
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate feed + ping IndexNow
        env:
          FEED_OUTPUT: ./google-feed.xml
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python3 feed_keeper.py

      - name: Commit feed back if it changed
        run: |
          git config user.name "yumrare-bots"
          git config user.email "garveythepug+yumrare@gmail.com"
          git add google-feed.xml
          if git diff --cached --quiet; then
            echo "feed unchanged"
          else
            git commit -m "feed-keeper: refresh google-feed.xml"
            git push
          fi
