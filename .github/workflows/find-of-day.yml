name: Find of the Day

# ~9:00 US/Central during daylight time (14:00 UTC); 8:00 in standard
# time. GitHub cron is UTC-only — this one-hour seasonal drift is
# accepted rather than edited twice a year.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compose only, post nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: find-of-day
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (Tumblr only; the rest is stdlib)
        run: pip install -r requirements.txt

      - name: Post today's find
        env:
          # Set the repository variable DRY_RUN=1 to park the bot in
          # compose-only mode without touching this file.
          DRY_RUN: ${{ inputs.dry_run && '1' || vars.DRY_RUN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          TUMBLR_BLOG: ${{ secrets.TUMBLR_BLOG }}
        run: python3 find_of_day.py

      # Per-platform state must survive even a partial failure, or the
      # next run could re-post to a platform that already succeeded.
      - name: Commit rotation state back
        if: always()
        run: |
          git config user.name "yumrare-bots"
          git config user.email "garveythepug+yumrare@gmail.com"
          git add rotation_state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "find-of-day: rotation state"
            git push
          fi
